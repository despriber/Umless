[project]
name = "umless"
version = "0.3.1"
description = "Umless：会帮你改掉口癖的开源语音输入工具（Windows 桌面端）"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "sherpa-onnx==1.13.8",
    # sherpa-onnx 的运行时（含 onnxruntime.dll），显式声明避免回落到 System32 下的旧版 DLL
    "sherpa-onnx-core==1.13.8",
    "numpy",
    "sounddevice",
    "soundfile",
    "httpx",
    "pynput",
    "pystray",
    "pillow",
    "pyperclip",
    "psutil",
    "pywebview>=6.2.1",
    "tomlkit>=0.15.1",
]

[project.scripts]
umless = "umless.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
